<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Weddo Renaissance Monogram</title>
  <!-- Outer Monoline Gallery Circle -->
  <circle cx="128" cy="128" r="108" fill="none" stroke="#000000" stroke-width="10" />

  <!-- Classical Renaissance Crossed-V 'W' -->
  <g fill="none" stroke="#000000" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Serifs (Top Cornice Terminals) -->
    <path d="M52 76 H74 M116 76 H140 M182 76 H204" stroke-width="6" stroke-linecap="round" />
    
    <!-- First V: Thick downstroke, Hairline upstroke -->
    <!-- Broad Left Downstroke (filled polygon for true Roman modulation) -->
    <path d="M58 76 L92 184 H104 L70 76 Z" fill="#000000" stroke="none" />
    <!-- Hairline Upstroke -->
    <path d="M98 184 L134 76" stroke-width="5" stroke-linecap="round" />

    <!-- Second V: Overlapping Renaissance Cross -->
    <!-- Broad Center Downstroke -->
    <path d="M122 76 L156 184 H168 L134 76 Z" fill="#000000" stroke="none" />
    <!-- Hairline Upstroke -->
    <path d="M162 184 L198 76" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
