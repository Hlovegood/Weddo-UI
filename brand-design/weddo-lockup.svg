<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 256" width="768" height="256">
  <title>Weddo — Full Brand Lockup</title>
  
  <!-- Left: Monogram Mark (Centered at 128, 128) -->
  <g transform="translate(16, 16) scale(0.875)">
    <g fill="#000000" fill-rule="evenodd">
      <path d="M128,16 A112,112 0 1,0 128,240 A112,112 0 1,0 128,16 Z M128,24 A104,104 0 1,1 128,232 A104,104 0 1,1 128,24 Z" />
      <rect x="56" y="69" width="30" height="5" rx="1.5" />
      <rect x="113" y="69" width="32" height="5" rx="1.5" />
      <rect x="172" y="69" width="28" height="5" rx="1.5" />
      <polygon points="66,74 80,74 109,182 95,182" />
      <polygon points="98,182 103,182 132,74 127,74" />
      <rect x="91" y="182" width="20" height="4" rx="1" />
      <polygon points="121,74 135,74 164,182 150,182" />
      <polygon points="153,182 158,182 187,74 182,74" />
      <rect x="146" y="182" width="20" height="4" rx="1" />
    </g>
  </g>

  <!-- Right: Typography Wordmark & Subtitle -->
  <g fill="#000000">
    <!-- Davinci Serif Brand Wordmark 'WEDDO' -->
    <text 
      x="270" 
      y="144" 
      font-family="'Playfair Display', Georgia, Cambria, 'Times New Roman', serif" 
      font-size="88" 
      font-weight="500" 
      letter-spacing="-2.5"
    >
      WEDDO
    </text>
    
    <!-- Museum Subtitle -->
    <text 
      x="274" 
      y="182" 
      font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-size="16" 
      font-weight="500" 
      letter-spacing="5"
      fill="#595855"
    >
      VENUES &amp; ESTATES • CAIRO
    </text>
  </g>
</svg>
